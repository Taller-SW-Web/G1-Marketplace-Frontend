name: H3 Frontend
on:
  push:
    branches: [feat/s1-f006-f007-catalogo]
  workflow_dispatch:
    inputs:
      real_demo_network:
        description: Read-only REAL demo from GitHub-hosted network (no JWT)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: h3-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || !inputs.real_demo_network
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: G1-Marketplace-Frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: G1-Marketplace-Frontend
          fetch-depth: 0
          persist-credentials: false
      - name: Public Backend at fixed H3 revision (no token required)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Taller-SW-Web/G1-Marketplace-Backend
          ref: 28ab802cd9ac5f56a9621fbad83fd129f732a7d6
          path: G1-Marketplace-Backend
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            G1-Marketplace-Frontend/package-lock.json
            G1-Marketplace-Backend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm --prefix ../G1-Marketplace-Backend ci
      - run: npm run lint
      - run: npm run test:components
      - run: npm run test:server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run typecheck
      - run: python -m pip install -r .security/requirements.txt
      - run: python scripts/install-gitleaks.py
      - run: python scripts/security-check.py --base 0b0ed1c8c3449442e5611ddb321b80c73b1c0fc8 --artifact .next/static
      - name: Build and start our Docker H3 stack
        working-directory: G1-Marketplace-Backend
        run: docker compose -f compose.h3.yaml up --build --detach --wait --wait-timeout 180
      - name: Verify Docker web, BFF and disposable PostgreSQL
        working-directory: G1-Marketplace-Backend
        run: node scripts/check-docker-h3.mjs
      - name: Stop our Docker H3 stack
        if: always()
        working-directory: G1-Marketplace-Backend
        run: docker compose -f compose.h3.yaml down
      - name: Sanitized security evidence and synthetic browser report (7 days)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: h3-frontend-evidence
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            G1-Marketplace-Frontend/.local-security/summary.json
            G1-Marketplace-Frontend/.local-security/licenses.json
            G1-Marketplace-Frontend/playwright-report/

  real-demo-network:
    if: github.event_name == 'workflow_dispatch' && inputs.real_demo_network
    name: REAL catalog from GitHub-hosted network
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: G1-Marketplace-Frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: G1-Marketplace-Frontend
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Taller-SW-Web/G1-Marketplace-Backend
          ref: 28ab802cd9ac5f56a9621fbad83fd129f732a7d6
          path: G1-Marketplace-Backend
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
      - name: TLS and direct public G6 GET (no credentials, no bodies in logs)
        run: npm run check:g6:network
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix ../G1-Marketplace-Backend ci --no-audit --no-fund
      - name: Build and rehearse Next to BFF to G6 REAL from this network
        run: npm run demo:catalogo:real -- --check
