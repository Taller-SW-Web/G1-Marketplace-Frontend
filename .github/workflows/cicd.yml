name: CI-CD

# Pipeline Unificado Frontend H5 (TASK-H5-CICD-002 / FE #136):
# lint -> typecheck -> unitarias -> build -> seguridad (SAST, Gitleaks, SCA, Licencias)
# -> release (SemVer) -> imagen Docker (GHCR) -> deploy staging -> smoke -> aprobación -> producción.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint-typecheck-unit:
    name: 1. Lint, Typecheck y Unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Lint (ESLint)
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Test del runner REAL local (sin red)
        run: npm run test:demo:catalogo:real
      - name: Pruebas unitarias de componentes (Vitest)
        run: npm run test:components
      - name: Pruebas unitarias de servidor (Vitest)
        run: npm run test:server

  build-and-security:
    name: 2. Build y Seguridad (SAST, Gitleaks, SCA, Licencias)
    needs: lint-typecheck-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias y compilar Build (Next.js)
        run: npm ci --no-audit --no-fund && npm run build
      - name: SAST (Semgrep sobre src/)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep \
            semgrep scan /src/src \
            --config p/typescript \
            --config p/react \
            --config p/security-audit \
            --severity ERROR \
            --exclude "*.test.ts" \
            --exclude "*.test.tsx" \
            --sarif --output /src/semgrep.sarif \
            --error
      - name: Secret Scan (Gitleaks código e historial)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo \
            --report-format=sarif \
            --report-path=/repo/gitleaks.sarif \
            --redact \
            --verbose
      - name: Gate SCA (npm audit producción HIGH/CRITICAL) y Licencias
        run: npm audit --omit=dev --audit-level=high && node scripts/check-licenses.mjs
      - name: Gate OSV-Scanner sobre package-lock.json (CVSS >= 7.0)
        run: |
          set +e
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/google/osv-scanner:latest \
            --lockfile=/repo/package-lock.json \
            --format=sarif > osv-report.sarif
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::Error de ejecución en OSV-Scanner (exit code $rc)"
            exit "$rc"
          fi
          node -e '
            const fs = require("fs");
            const sarif = JSON.parse(fs.readFileSync("osv-report.sarif", "utf8"));
            const rules = new Map();
            for (const run of sarif.runs || []) {
              for (const rule of run.tool?.driver?.rules || []) rules.set(rule.id, rule);
            }
            const results = (sarif.runs || []).flatMap((r) => r.results || []);
            const highOrCritical = results.filter((res) => Number(rules.get(res.ruleId)?.properties?.["security-severity"] ?? 0) >= 7.0);
            console.log(`OSV-Scanner FE: ${results.length} hallazgos totales, ${highOrCritical.length} HIGH/CRITICAL.`);
            if (highOrCritical.length > 0) process.exit(1);
          '
      - name: Archivar reportes de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-cicd-security-reports
          path: |
            semgrep.sarif
            gitleaks.sarif
            osv-report.sarif
            licenses-report.json
          if-no-files-found: warn
          retention-days: 30

  release:
    name: 3. Versionado (SemVer + CHANGELOG)
    needs: build-and-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-image:
    name: 4. Imagen Docker etiquetada (GHCR)
    needs: [release, build-and-security]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/taller-sw-web/g1-marketplace-frontend:${{ needs.release.outputs.version }}
            ghcr.io/taller-sw-web/g1-marketplace-frontend:latest

  deploy:
    name: 5. Smoke Test Post-CI (autodespliegue nativo Vercel)
    needs: [build-and-security, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.FRONTEND_URL || 'https://g1-marketplace-frontend.vercel.app' }}
    steps:
      - name: Smoke test del sitio (/ y /carrito) tras autodespliegue de Vercel
        run: |
          echo "Vercel autodespliega tras el CI (sin deploy hooks duplicados). Versión: ${{ needs.release.outputs.version || 'sin cambios' }}"
          for i in $(seq 1 20); do
            code_home=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${SITE_URL%/}/" || true)
            code_cart=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${SITE_URL%/}/carrito" || true)
            echo "intento $i -> / HTTP $code_home | /carrito HTTP $code_cart"
            if [ "$code_home" = "200" ] && [ "$code_cart" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::El sitio no respondió 200"; exit 1
