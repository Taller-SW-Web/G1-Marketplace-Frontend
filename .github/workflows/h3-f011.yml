name: H3 F-011 Frontend

on:
  push:
    branches: [feat/h3-f011-f015-detalle-de-producto]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h3-f011-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:components
      - run: npm run build
      # test:e2e (Playwright) queda fuera: su webServer arranca
      # ../G1-Marketplace-Backend/src/server.js y exige GET /api/v1/catalog/home,
      # dependencias de la rama de Giuliano aún no fusionadas en develop (PR #11).
