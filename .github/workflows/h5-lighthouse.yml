name: H5 Lighthouse Frontend

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/demo-catalog-h4.mjs'
      - 'package*.json'
      - 'next.config.ts'
      - 'lighthouserc.cjs'
      - '.github/workflows/h5-lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h5-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: G1-Marketplace-Frontend
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: G1-Marketplace-Frontend
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Taller-SW-Web/G1-Marketplace-Backend
          ref: f11139f086a054247d818f6065987458bb2e4170
          path: G1-Marketplace-Backend
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            G1-Marketplace-Frontend/package-lock.json
            G1-Marketplace-Backend/package-lock.json
      - run: npm ci
      - run: npm --prefix ../G1-Marketplace-Backend ci
      - run: npm --prefix ../G1-Marketplace-Backend run build
      - run: npm run build
      - name: Medir catálogo MOCK con Lighthouse
        run: CHROME_PATH="$(command -v google-chrome)" npm exec --yes --package @lhci/cli@0.15.1 -- lhci autorun --config=lighthouserc.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: h5-lighthouse-catalogo-mock
          path: G1-Marketplace-Frontend/.lighthouseci/
          include-hidden-files: true
          retention-days: 7
