name: H4 G7 auth web contracts
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:components
      - run: npm run test:server
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Keyboard and account state checks with browser-only fixtures
        run: npx playwright test --config playwright.auth-ui.config.ts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r .security/requirements.txt
      - run: python scripts/install-gitleaks.py
      - run: python -m unittest discover -s tests/security -p 'test_*.py'
      - name: Scan source, PR history, build, dependencies and license inventory
        env:
          AUTH_SECURITY_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/security-check.py --base "$AUTH_SECURITY_BASE" --artifact .next
      - name: Sanitized security metadata only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: h4-auth-web-security
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .local-security/summary.json
            .local-security/licenses.json
