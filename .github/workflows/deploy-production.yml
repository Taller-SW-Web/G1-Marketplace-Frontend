name: Deploy producción (aprobación manual)

# Despliegue del Frontend a producción con aprobación obligatoria.
# El job usa el environment `production`, que exige la aprobación de los revisores
# configurados en GitHub (Settings > Environments > production). Hasta que uno
# apruebe, el job queda en «Waiting for review» y NO se despliega.
# Requiere que Vercel no despliegue `main` automáticamente (si no, despliega por su cuenta
# al fusionar, antes de la aprobación).
# Modo API (preferido): con VERCEL_TOKEN y VERCEL_PROJECT_ID (y opcional VERCEL_TEAM_ID) se crea
# el despliegue de producción del SHA EXACTO aprobado y se espera a ese ID.
# Modo hook (respaldo): con VERCEL_DEPLOY_HOOK_URL se despliega el último commit de main, tras
# comprobar que sigue siendo el aprobado; se verifica después qué SHA quedó activo.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    name: Despliegue a producción (requiere aprobación)
    # Solo desde main, también en ejecuciones manuales (workflow_dispatch).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://g1-marketplace-frontend.vercel.app
    steps:
      - name: Comprobar que el commit aprobado sigue siendo el último de main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)
          echo "SHA de esta ejecución: ${GITHUB_SHA}"
          echo "SHA actual de main:    ${head}"
          if [ "$head" != "${GITHUB_SHA}" ]; then
            echo "::error::main avanzó (${head}). Aprueba la ejecución del commit más reciente."
            exit 1
          fi

      - name: Solicitar el despliegue en Vercel
        id: deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          REPO_ID: ${{ github.event.repository.id }}
        run: |
          team=""
          if [ -n "$VERCEL_TEAM_ID" ]; then team="teamId=${VERCEL_TEAM_ID}"; fi
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Modo API: despliegue de producción del SHA exacto ${GITHUB_SHA}"
            name=$(curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?${team}" | jq -r '.name')
            body=$(jq -nc --arg sha "$GITHUB_SHA" --arg project "$VERCEL_PROJECT_ID" --arg name "$name" --argjson repo "$REPO_ID" \
              '{name:$name, project:$project, target:"production", gitSource:{type:"github", repoId:$repo, ref:"main", sha:$sha}}')
            response=$(curl -fsS -X POST -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json" \
              "https://api.vercel.com/v13/deployments?forceNew=1&${team}" -d "$body")
            deploy_id=$(echo "$response" | jq -r '.id // empty')
            if [ -z "$deploy_id" ]; then
              echo "::error::Vercel no devolvió el ID del despliegue"
              exit 1
            fi
            echo "mode=api" >> "$GITHUB_OUTPUT"
            echo "deploy_id=${deploy_id}" >> "$GITHUB_OUTPUT"
            { echo "### Despliegue a producción (Frontend, modo API)"; echo "- Commit aprobado: \`${GITHUB_SHA}\`"; echo "- ID del despliegue de Vercel: \`${deploy_id}\`"; } >> "$GITHUB_STEP_SUMMARY"
          else
            if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
              echo "::error::Faltan VERCEL_TOKEN/VERCEL_PROJECT_ID y también VERCEL_DEPLOY_HOOK_URL"
              exit 1
            fi
            echo "Modo hook: despliega el último commit de main (comprobado arriba)"
            response=$(curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL")
            echo "mode=hook" >> "$GITHUB_OUTPUT"
            { echo "### Despliegue a producción (Frontend, modo hook)"; echo "- Commit aprobado: \`${GITHUB_SHA}\`"; echo "- Respuesta de Vercel: \`${response}\`"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Esperar a que el despliegue quede listo y confirmar su commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          MODE: ${{ steps.deploy.outputs.mode }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Faltan VERCEL_TOKEN o VERCEL_PROJECT_ID: no se puede confirmar el SHA activo; solo se verificará que el sitio responde."
            echo "- Verificación del SHA activo: OMITIDA (sin VERCEL_TOKEN/VERCEL_PROJECT_ID). Se confirma en el panel de Vercel." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          team=""
          if [ -n "$VERCEL_TEAM_ID" ]; then team="&teamId=${VERCEL_TEAM_ID}"; fi
          for i in $(seq 1 60); do
            if [ "$MODE" = "api" ]; then
              deploy=$(curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" "https://api.vercel.com/v13/deployments/${DEPLOY_ID}?x=1${team}")
            else
              deploy=$(curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=10${team}" \
                | jq -c --arg sha "$GITHUB_SHA" '.deployments | map(select(.meta.githubCommitSha == $sha)) | .[0] // empty')
            fi
            state=$(echo "$deploy" | jq -r '.readyState // .state // "no_encontrado"')
            id=$(echo "$deploy" | jq -r '.id // .uid // "-"')
            commit=$(echo "$deploy" | jq -r '.meta.githubCommitSha // "-"')
            echo "intento $i: despliegue ${id} estado=${state} commit=${commit}"
            case "$state" in
              READY)
                if [ "$commit" != "${GITHUB_SHA}" ]; then
                  echo "::error::El despliegue ${id} quedó listo con el commit ${commit}, no con el aprobado ${GITHUB_SHA}"
                  exit 1
                fi
                echo "- Despliegue \`${id}\` listo con el commit aprobado \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              ERROR|CANCELED)
                echo "::error::El despliegue ${id} terminó en estado ${state}"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Tiempo agotado esperando que el despliegue quede listo"
          exit 1

      - name: Verificar que el sitio responde
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://g1-marketplace-frontend.vercel.app/registro || true)
            echo "intento $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::el sitio no respondió 200"
          exit 1
